name: Feature request
description: Suggest a focused extension improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow problem
      description: What read-later cleanup workflow should improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permission or privacy impact
      description: Does this need new browser permissions or remote services?

